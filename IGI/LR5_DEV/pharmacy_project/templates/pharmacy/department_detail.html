<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{{ department.name }}</title>
</head>
<body>
    <p><a href="{% url 'pharmacy:medication_list' %}">К каталогу</a></p>
    <h1>{{ department.name }} (этаж {{ department.floor }})</h1>
    <p>{{ department.description }}</p>
    <h2>Препараты</h2>
    <ul>
        {% for m in department.medications.all %}
            <li><a href="{{ m.get_absolute_url }}">{{ m.name }}</a> — {{ m.price }}</li>
        {% empty %}
            <li>Пока нет препаратов в этом отделе.</li>
        {% endfor %}
    </ul>
</body>
</html>
