{% extends "dashboard/base.html" %}
{% block title %}Удалить {{ object.name }}{% endblock %}
{% block content %}
<section class="card animate-enter" style="max-width:520px;">
    <h1>Удалить поставщика?</h1>
    <p class="lead"><strong>{{ object.name }}</strong> ({{ object.contract_number }})</p>
    <form method="post">
        {% csrf_token %}
        <div class="hero-actions">
            <button class="btn btn-primary" type="submit" style="background:linear-gradient(135deg,#f87171,#b91c1c); box-shadow:none;">Да, удалить</button>
            <a class="btn btn-ghost" href="{{ object.get_absolute_url }}">Отмена</a>
        </div>
    </form>
</section>
{% endblock %}
