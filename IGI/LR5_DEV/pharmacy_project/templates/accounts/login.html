<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Вход</title>
</head>
<body>
    <h1>Вход</h1>
    {% if form.errors %}
        <p>Неверные имя пользователя или пароль.</p>
    {% endif %}
    <form method="post" action="">
        {% csrf_token %}
        <table>{{ form.as_table }}</table>
        <button type="submit">Войти</button>
    </form>
    <p><a href="{% url 'accounts:register' %}">Регистрация</a> · <a href="{% url 'core:home' %}">На главную</a></p>
</body>
</html>
